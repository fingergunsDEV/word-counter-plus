<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Analysis Widget</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
  
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 40px;
      color: #333;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
      padding: 40px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: #1a202c;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 16px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 1rem;
      resize: vertical;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .stat-box {
      background: #edf2f7;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }

    .stat-box strong {
      display: block;
      font-size: 1.2rem;
      color: #2d3748;
    }

    .controls {
      margin-top: 30px;
    }

    .controls button {
      background: #2b6cb0;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      margin-right: 10px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .controls button:hover {
      background: #2c5282;
    }

    #keywordDensity {
      margin-top: 20px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
    }

    .keyword-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      padding: 6px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header"><span class="material-icons">insights</span>
<h1>SEO Text Analysis Tool</h1></div>
    <textarea id="inputText" placeholder="Paste or write your content here..."></textarea>

    <div class="grid">
      <div class="stat-box"><strong id="wordCount">0</strong>Words</div>
      <div class="stat-box"><strong id="charCount">0</strong>Characters</div>
      <div class="stat-box"><strong id="sentenceCount">0</strong>Sentences</div>
      <div class="stat-box"><strong id="paragraphCount">0</strong>Paragraphs</div>
      <div class="stat-box"><strong id="readingLevel">-</strong>Reading Level</div>
      <div class="stat-box"><strong id="readingTime">0 min</strong>Reading Time</div>
      <div class="stat-box"><strong id="speakingTime">0 min</strong>Speaking Time</div>
    </div>

    <div class="controls">
      <h2>Keyword Density (N-gram)</h2>
      <button onclick="updateDensityView(1)">x1</button>
      <button onclick="updateDensityView(2)">x2</button>
      <button onclick="updateDensityView(3)">x3</button>
      <button onclick="copyDensity()">📋 Copy Density Table</button>
    </div>

    <div id="keywordDensity"></div>
  </div>

  <script>
    const input = document.getElementById("inputText");
    const densityContainer = document.getElementById("keywordDensity");
    let currentN = 1;

    input.addEventListener("input", debounce(countStats, 300));

    function debounce(fn, delay) {
      let timeout;
      return function () {
        clearTimeout(timeout);
        timeout = setTimeout(fn, delay);
      };
    }

    function countStats() {
      const text = input.value;
      const words = (text.match(/\b[\w'-]+\b/g) || []);
      const characters = text.length;
      const sentences = (text.match(/[^.!?]+[.!?]+/g) || []).length;
      const paragraphs = (text.trim().match(/\n+/g) || []).length + 1;
      const readingTime = (words.length / 275).toFixed(2);
      const speakingTime = (words.length / 180).toFixed(2);
      const syllables = text.split(/\s+/).reduce((a, word) => a + (word.match(/[aeiouy]+/gi) || []).length, 0);
      const readingLevel = (206.835 - 1.015 * (words.length / Math.max(sentences, 1)) - 84.6 * (syllables / Math.max(words.length, 1))).toFixed(0);

      document.getElementById("wordCount").textContent = words.length;
      document.getElementById("charCount").textContent = characters;
      document.getElementById("sentenceCount").textContent = sentences;
      document.getElementById("paragraphCount").textContent = paragraphs;
      document.getElementById("readingTime").textContent = `${Math.floor(readingTime)} min ${Math.round((readingTime % 1) * 60)} sec`;
      document.getElementById("speakingTime").textContent = `${Math.floor(speakingTime)} min ${Math.round((speakingTime % 1) * 60)} sec`;
      document.getElementById("readingLevel").textContent = readingLevel >= 90 ? "5th Grade" :
                                                            readingLevel >= 60 ? "8th Grade" :
                                                            readingLevel >= 30 ? "College" : "College Graduate";

      renderKeywordDensity(words);
    }

    function renderKeywordDensity(words) {
      const ngrams = {};
      for (let i = 0; i < words.length - currentN + 1; i++) {
        const phrase = words.slice(i, i + currentN).join(" ").toLowerCase();
        if (phrase.length > 3) {
          ngrams[phrase] = (ngrams[phrase] || 0) + 1;
        }
      }

      const sorted = Object.entries(ngrams).filter(([_, count]) => count > 1)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 20);

      densityContainer.innerHTML = sorted.map(([phrase, count]) => {
        const percent = ((count / words.length) * 100).toFixed(1);
        return `<div class='keyword-row'><span>${phrase}</span><span>${count} (${percent}%)</span></div>`;
      }).join('');
    }

    function updateDensityView(n) {
      currentN = n;
      countStats();
    }

    function copyDensity() {
      const temp = document.createElement("textarea");
      temp.value = densityContainer.innerText;
      document.body.appendChild(temp);
      temp.select();
      document.execCommand("copy");
      document.body.removeChild(temp);
      alert("Keyword density copied to clipboard!");
    }
  </script>
</body>
</html>
